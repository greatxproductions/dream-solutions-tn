<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#c8d3dd"/>
      <stop offset="0.55" stop-color="#8fa3b3"/>
      <stop offset="0.8" stop-color="#d8e1e8"/>
      <stop offset="1" stop-color="#a9b6c2"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="pagebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#13202b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#pagebg)"/>

  <!-- emblem -->
  <g transform="translate(110,70) scale(1.6)">
    <path d="M 60 20 L 180 20 L 200 44 L 200 180 L 120 286 L 40 180 L 40 44 Z"
          fill="url(#navy)" stroke="url(#chrome)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 73 33 L 167 33 L 185 56 L 185 173 L 120 270 L 55 173 L 55 56 Z"
          fill="none" stroke="url(#chrome)" stroke-width="3.5" opacity="0.85"/>
    <g fill="none" stroke="url(#chrome)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 70 78 V 144 M 70 78 H 94 A 34 34 0 0 1 94 144 H 70"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 136 82 A 16 16 0 0 0 136 114 A 16 16 0 0 1 136 146" stroke="#0b0d12" stroke-width="20"/>
      <path d="M 136 82 A 16 16 0 0 0 136 114 A 16 16 0 0 1 136 146" stroke="url(#chrome)" stroke-width="16"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="580" y="248" fill="#4fc3f7" font-family="Montserrat, 'Century Gothic', Futura, Avenir, Helvetica, Arial, sans-serif" font-weight="600" font-size="40" letter-spacing="4">DREAM SOLUTIONS</text>
  <text x="580" y="332" fill="#26a69a" font-family="Montserrat, 'Century Gothic', Futura, Avenir, Helvetica, Arial, sans-serif" font-weight="700" font-size="48" letter-spacing="14">TENNESSEE</text>
  <line x1="580" y1="362" x2="712" y2="362" stroke="#26a69a" stroke-opacity="0.5" stroke-width="2"/>
  <text x="580" y="404" fill="#e2e8f0" font-family="Montserrat, 'Century Gothic', Futura, Avenir, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="5">PRESCRIBING CLEAN AIR FOR YOUR HOME</text>
</svg>
