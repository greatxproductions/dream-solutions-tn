<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#2BE6D7"/>
    </linearGradient>
    <linearGradient id="shieldbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F3D4A"/>
      <stop offset="1" stop-color="#0A1A20"/>
    </linearGradient>
    <linearGradient id="pagebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A20"/>
      <stop offset="1" stop-color="#0F3D4A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="trefoil">
      <circle cx="0" cy="0" r="4.5" fill="url(#cyan)"/>
      <path id="blade" d="M0,-4.5 L6.5,-12 A14,14 0 0 0 -6.5,-12 Z" fill="url(#cyan)"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(240)"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#pagebg)"/>

  <!-- shield emblem, left -->
  <g transform="translate(80,75) scale(1.6)">
    <path d="M 60 20 L 180 20 L 200 44 L 200 180 L 120 286 L 40 180 L 40 44 Z"
          fill="url(#shieldbg)" stroke="url(#cyan)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 74 34 L 166 34 L 186 58 L 186 166 L 120 272 L 54 166 L 54 58 Z"
          fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.55"/>
    <g fill="none" stroke="url(#cyan)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M 70 76 V 144 M 70 76 H 94 A 34 34 0 0 1 94 144 H 70"/>
      <path d="M 150 80 A 16 16 0 0 0 150 112 A 16 16 0 0 1 150 144"/>
    </g>
    <g fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 96 188 V 212 M 96 188 H 106 A 12 12 0 0 1 106 212 H 96 M 106 200 L 118 212"/>
      <path d="M 130 188 V 212 M 130 188 A 7 7 0 0 1 144 188 V 212"/>
    </g>
    <g fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round">
      <path d="M 40 290 q 20 -13 40 0 q 20 13 40 0 q 20 -13 40 0 q 20 13 40 0" opacity="0.9"/>
      <path d="M 46 304 q 20 -13 40 0 q 20 13 40 0 q 20 -13 40 0 q 20 13 40 0" opacity="0.62"/>
      <path d="M 52 318 q 20 -13 40 0 q 20 13 40 0 q 20 -13 40 0 q 20 13 40 0" opacity="0.38"/>
    </g>
  </g>

  <!-- wordmark + tagline, right -->
  <text x="520" y="225" fill="url(#cyan)" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" letter-spacing="5">DREAM SOLUTIONS</text>
  <text x="520" y="318" fill="url(#cyan)" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="66" letter-spacing="22">RADON</text>

  <!-- trefoil divider -->
  <g transform="translate(560,360) scale(1.7)"><use href="#trefoil"/></g>
  <line x1="600" y1="360" x2="720" y2="360" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="2"/>

  <text x="520" y="418" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="6">PRESCRIBING CLEAN AIR FOR YOUR HOME</text>
</svg>
